name: countdown
description: "Subscription tracker with countdown to the next charge."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  csv: ^8.0.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  dynamic_color: ^2.1.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  go_router: ^18.0.2
  home_widget: ^0.10.0
  intl: ^0.20.3
  material_ui: ^1.6.0
  package_info_plus: ^10.2.2
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - LICENSE
    - assets/icon/icon.png
    - assets/licenses/MaterialIcons_LICENSE.txt
